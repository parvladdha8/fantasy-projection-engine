[project]
name = "fantasy-projection-engine"
version = "0.1.0"
description = "Redraft full-PPR weekly fantasy projection engine"
requires-python = ">=3.12"
dependencies = [
    "nflreadpy>=0.1.5",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
