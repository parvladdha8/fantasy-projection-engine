# Living projections: download the latest 2026 data, project the next week, save the run to Supabase.
# Schedule pre-registered in DECISIONS.md (2026-11-04). Times are UTC; PT = UTC − 8 in winter.
name: Refresh projections
on:
  schedule:
    - cron: "0 13 * * *"          # daily, 5 am PT
    - cron: "20 */3 * * 4,5,6,0"  # Thu–Sun every 3 hours (injury news moves fastest)
    # Extra pre-kickoff runs (2026-11-07). GitHub skips scheduled runs when busy, so several chances per window,
    # at off-peak minutes. Times UTC (ET = UTC − 5 in winter):
    - cron: "13,43 15-17 * * 0"     # Sunday 10:13 am–12:43 pm ET, before the 1 pm games (and 9:30 am international games: 13:13 below)
    - cron: "13 13-14 * * 0"        # Sunday 8:13 / 9:13 am ET
    - cron: "13,43 20 * * 0"        # Sunday ~3:15–3:45 pm ET, before the 4:05 / 4:25 pm games
    - cron: "13,43 0 * * 1"         # Sunday ~7:15–7:45 pm ET, before Sunday night (8:20 pm ET)
    - cron: "13,43 0 * * 2"         # Monday ~7:15–7:45 pm ET, before Monday night (8:15 pm ET)
    - cron: "13,43 0 * * 5"         # Thursday ~7:15–7:45 pm ET, before Thursday night (8:15 pm ET)
  workflow_dispatch: {}           # "Run workflow" button for manual runs
permissions:
  contents: read
  issues: write
concurrency:
  group: pipeline                 # refresh and freeze never write at the same time
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Refresh (download → project → save → verify)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: uv run python scripts/run_pipeline.py
      - name: Sleeper snapshot (projections by RotoWire; stored privately, only error statistics are published)
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: uv run python scripts/snapshot_sleeper.py
      - name: Weather forecasts (Open-Meteo; stored only, not used in projections)
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: uv run python scripts/fetch_weather.py
      - name: Keep this run's 2026 download for 14 days (traceability)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pull-${{ github.run_id }}
          path: data/live/
          retention-days: 14
          if-no-files-found: ignore
      - name: Report failure
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          step: refresh
